project:
  type: website
  # Quarto writes the finished website into docs/, which GitHub Pages serves.
  output-dir: docs
  # Files used by raw HTML, which Quarto would not copy on its own.
  resources:
    - cells.js
    - images/

website:
  title: "Matias Lee"
  site-url: "https://matias-lee.github.io"
  description: "PhD student in Biomedical Engineering at Johns Hopkins University."
  favicon: images/favicon.png
  # Link previews when the site is shared on LinkedIn, Slack, and similar.
  open-graph:
    image: images/social-card.png
  twitter-card:
    image: images/social-card.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: news.qmd
        text: News
      - href: blog/index.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: envelope
        href: "mailto:mlee346@jh.edu"
        aria-label: Email
      - icon: linkedin
        href: "https://www.linkedin.com/in/matias-lee-phd"
        aria-label: LinkedIn
      - icon: github
        href: "https://github.com/matias-lee"
        aria-label: GitHub
  page-footer:
    center: "© 2026 Matias Lee · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    # Full-width layout; styles.scss sets the text card to about 65% of the window.
    page-layout: full
    # No math on this site, so skip loading MathJax and its polyfill from outside servers.
    html-math-method: plain
    include-after-body: _includes/cell-background.html
    # Privacy: no analytics, no comment widgets, no third-party fonts.
    include-in-header:
      text: |
        <meta name="referrer" content="strict-origin-when-cross-origin">
